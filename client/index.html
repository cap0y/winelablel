<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />

    <!-- PWA Meta Tags -->
    <title>끄레망 와인라벨 - 나만의 와인 라벨 제작 서비스</title>
    <meta
      name="description"
      content="나만의 특별한 와인 라벨을 디자인하고 주문할 수 있는 서비스"
    />
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS Safari PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="끄레망 와인라벨" />
    <link rel="apple-touch-icon" href="/vite.svg" />

    <!-- Android Chrome PWA -->
    <meta name="theme-color" content="#722F37" />
    <meta name="application-name" content="끄레망 와인라벨" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Samsung Browser -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#722F37"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#4A1D24"
    />

    <!-- Theme Color -->
    <meta name="theme-color" content="#722F37" />
    <meta name="msapplication-navbutton-color" content="#722F37" />

    <!-- Favicon -->
    <link rel="icon" href="/vite.svg" type="image/svg+xml" />
    <link rel="shortcut icon" href="/vite.svg" />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="끄레망 와인라벨 - 나만의 와인 라벨 제작 서비스"
    />
    <meta
      property="og:description"
      content="나만의 특별한 와인 라벨을 디자인하고 주문할 수 있는 서비스"
    />
    <meta property="og:image" content="/vite.svg" />
    <meta property="og:url" content="https://cremant-winelabel.com" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="끄레망 와인라벨 - 나만의 와인 라벨 제작 서비스"
    />
    <meta
      name="twitter:description"
      content="나만의 특별한 와인 라벨을 디자인하고 주문할 수 있는 서비스"
    />
    <meta name="twitter:image" content="/vite.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((registration) => {
              console.log("SW registered: ", registration);
            })
            .catch((registrationError) => {
              console.log("SW registration failed: ", registrationError);
            });
        });
      }
    </script>

    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script
      type="text/javascript"
      src="https://replit.com/public/js/replit-dev-banner.js"
    ></script>
  </body>
</html>
